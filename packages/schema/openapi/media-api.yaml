openapi: 3.1.0
info:
  title: ethannet photos-api
  description: >-
    Contract between the Next.js ui and the Spring Boot photos-api. This file is
    the source of truth: the ui's TypeScript types and the api's Java interfaces
    are both generated from it.
  version: 0.1.0
servers:
  - url: http://localhost:4001
    description: Local development
paths:
  /api/hello:
    get:
      operationId: getHello
      summary: Greeting from the api
      description: Returns a greeting and the time the api built it. Used as a smoke test of the ui → api path.
      tags:
        - hello
      responses:
        "200":
          description: The greeting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloResponse"
components:
  schemas:
    HelloResponse:
      type: object
      description: Greeting returned by `GET /api/hello`.
      required:
        - message
        - timestamp
      properties:
        message:
          type: string
          description: Human-readable greeting.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 time the response was built, in UTC.
